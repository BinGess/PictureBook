<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>页面管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
  <a href="/admin/books">管理后台</a>
  <div class="spacer"></div>
  <a href="/admin/categories" class="btn small">分类管理</a>
  <a href="/admin/books" class="btn small">返回列表</a>
</div>
<div class="container">
<div class="card">
<h2 class="title">页面管理：{{.book.Title}}</h2>
<div class="row wrap" style="margin-bottom:12px;">
  <div>
    {{if .book.CoverURL}}<img class="thumb" style="width:160px;height:120px;" src="{{.book.CoverURL}}" alt="cover">{{else}}<span class="muted">无封面</span>{{end}}
  </div>
  <div class="actions">
    <a class="btn small" href="/admin/books/{{.book.ID}}/edit">编辑元数据</a>
  </div>
</div>
<div>
  <form method="post" action="/admin/books/{{.book.ID}}/editor-pick">
    <label>
      <input type="checkbox" name="isEditorPick" {{if .book.IsEditorPick}}checked{{end}}> 设为编辑推荐（最多5本）
    </label>
    <button class="btn primary" type="submit">保存</button>
    {{if .error}}<span class="muted" style="color:#dc2626;">编辑推荐已达上限</span>{{end}}
  </form>
  <hr>
</div>
<div>
  <h3 class="title" style="font-size:18px;">已发布页面</h3>
  <table>
    <tr><th>#</th><th>缩略图</th><th>图片URL</th></tr>
    {{range .book.Pages}}
    <tr>
      <td>{{.Index}}</td>
      <td><img class="thumb" src="{{.ImageURL}}" alt="page"></td>
      <td class="muted">{{.ImageURL}}</td>
    </tr>
    {{end}}
  </table>
</div>
<div>
  <h3 class="title" style="font-size:18px;">批量上传图片</h3>
  <form id="uploadForm" method="post" action="/v1/admin/books/{{.book.ID}}/pages/upload" enctype="multipart/form-data">
    <input id="filesInput" type="file" name="files" multiple>
    <button id="uploadBtn" class="btn" type="submit">上传</button>
  </form>
  <div id="uploadList"></div>
  <p>上传成功后会直接生成页面并显示在上方列表。</p>
</div>

<div>
  <h3 class="title" style="font-size:18px;">编辑顺序</h3>
  <form method="post" action="/admin/books/{{.book.ID}}/pages/reorder">
    <table>
      <tr><th>页面ID</th><th>缩略图</th><th>当前顺序</th></tr>
      {{range .book.Pages}}
      <tr>
        <td>{{.ID}}</td>
        <td><img class="thumb" src="{{.ImageURL}}" alt="page"></td>
        <td>
          <input class="input" type="number" name="index[{{.ID}}]" value="{{.Index}}" style="width:80px">
        </td>
      </tr>
      {{end}}
    </table>
    <button class="btn primary" type="submit">保存顺序</button>
  </form>
</div>

<script>
  (function(){
    const form = document.getElementById('uploadForm');
    const input = document.getElementById('filesInput');
    const list = document.getElementById('uploadList');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      const files = input.files;
      if (!files || files.length === 0) return;
      list.innerHTML = '';
      let completed = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const row = document.createElement('div');
        row.style.margin = '8px 0';
        row.textContent = file.name + ' ';
        const barWrap = document.createElement('div');
        barWrap.style.height = '6px';
        barWrap.style.background = '#eee';
        barWrap.style.borderRadius = '4px';
        barWrap.style.width = '240px';
        barWrap.style.display = 'inline-block';
        barWrap.style.marginLeft = '8px';
        const bar = document.createElement('div');
        bar.style.height = '100%';
        bar.style.width = '0%';
        bar.style.background = '#4a90e2';
        bar.style.borderRadius = '4px';
        barWrap.appendChild(bar);
        const status = document.createElement('span');
        status.style.marginLeft = '8px';
        status.textContent = '0%';
        row.appendChild(barWrap);
        row.appendChild(status);
        list.appendChild(row);
        const fd = new FormData();
        fd.append('files', file, file.name);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', form.action);
        xhr.upload.onprogress = function(evt){
          if (evt.lengthComputable) {
            const p = Math.round((evt.loaded / evt.total) * 100);
            bar.style.width = p + '%';
            status.textContent = p + '%';
          }
        };
        xhr.onload = function(){
          status.textContent = xhr.status === 200 ? '完成' : '失败';
          if (xhr.status === 200) {
            completed++;
            if (completed === files.length) {
              setTimeout(function(){ location.reload(); }, 500);
            }
          }
        };
        xhr.onerror = function(){ status.textContent = '失败'; };
        xhr.send(fd);
      }
    });
  })();
</script>
</div>
</div>
</body></html>
