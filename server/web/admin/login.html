<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>后台登录</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="nav">
    <a href="/admin/login">管理后台登录</a>
  </div>
  <div class="container">
    <div class="card" style="max-width:480px;margin:40px auto;">
      <h2 class="title">后台登录</h2>
      {{if .error}}<div class="muted" style="color:#dc2626;">登录失败</div>{{end}}
      <form method="post" action="/admin/login">
        <div class="field">
          <div class="label">邮箱</div>
          <input class="input" name="email" value="admin@example.com">
        </div>
        <div class="field">
          <div class="label">密码</div>
          <input class="input" name="password" type="password">
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">登录</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
