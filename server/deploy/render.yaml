services:
  - type: web
    name: picturebook-server
    env: docker
    plan: starter
    dockerfilePath: server/Dockerfile
    disk:
      name: pb-data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SQLITE_PATH
        value: "/app/data/picturebook.db"
      - key: UPLOADS_DIR
        value: "/app/data/uploads"
      - key: DATABASE_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /healthz