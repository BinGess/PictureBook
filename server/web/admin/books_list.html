<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>书籍列表</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="nav">
    <a href="/admin/books">管理后台</a>
    <div class="spacer"></div>
    <a href="/admin/categories" class="btn small">分类管理</a>
    <a href="/admin/books/new" class="btn primary small">新建书籍</a>
  </div>
  <div class="container">
    <div class="card">
      <h2 class="title">书籍列表</h2>
      <div class="row wrap" style="margin-bottom:12px;">
        <div style="flex:1;">
          <div class="label">搜索（按标题或ID）</div>
          <input id="q" class="input" placeholder="输入关键字...">
        </div>
        <div class="row" style="gap:8px;">
          <div>
            <div class="label">排序</div>
            <select id="sort" class="input">
              <option value="popular">按热门度</option>
              <option value="title">按标题</option>
            </select>
          </div>
          <div style="align-self:flex-end;">
            <a href="/admin/books/new" class="btn primary">新建书籍</a>
          </div>
        </div>
      </div>
      <table>
        <tr><th>封面</th><th>ID</th><th>标题</th><th>适龄</th><th>编辑推荐</th><th>操作</th></tr>
        {{range .items}}
        <tr class="row-item" data-id="{{.ID}}" data-title="{{.Title}}">
          <td>
            {{if .CoverURL}}<img class="thumb" src="{{.CoverURL}}" alt="cover">{{else}}<span class="muted">无</span>{{end}}
          </td>
          <td>{{.ID}}</td>
          <td>{{.Title}}</td>
          <td>{{.AgeMin}}-{{.AgeMax}}</td>
          <td>{{.IsEditorPick}}</td>
          <td class="actions">
            <a class="btn small" href="/admin/books/{{.ID}}/pages">页面</a>
            <form method="post" action="/admin/books/{{.ID}}/delete" onsubmit="return confirm('确认删除该图书及其页面？此操作不可恢复');">
              <button class="btn danger small" type="submit">删除</button>
            </form>
          </td>
        </tr>
        {{end}}
      </table>
      <div class="row" style="justify-content:space-between;margin-top:12px;">
        <a id="prev" class="btn">上一页</a>
        <span class="muted">第 <span id="pcur"></span> 页</span>
        <a id="next" class="btn">下一页</a>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const q = document.getElementById('q');
      const rows = Array.from(document.querySelectorAll('.row-item'));
      const curPage = {{.page}};
      const pageSize = {{.page_size}};
      const hasMore = {{.has_more}};
      const sortSel = document.getElementById('sort');
      sortSel.value = '{{.sort}}';
      q.addEventListener('input', function(){
        const s = q.value.trim().toLowerCase();
        rows.forEach(r => {
          const id = (r.getAttribute('data-id')||'').toLowerCase();
          const title = (r.getAttribute('data-title')||'').toLowerCase();
          r.style.display = (s === '' || id.includes(s) || title.includes(s)) ? '' : 'none';
        });
      });
      document.getElementById('pcur').textContent = curPage;
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const qs = new URLSearchParams(window.location.search);
      qs.set('page_size', pageSize);
      qs.set('sort', sortSel.value);
      sortSel.addEventListener('change', function(){
        qs.set('sort', sortSel.value);
        window.location.href = '/admin/books?' + qs.toString();
      });
      if (curPage > 1) {
        prev.href = '/admin/books?' + (function(){ const t = new URLSearchParams(qs); t.set('page', curPage - 1); return t.toString(); })();
      } else {
        prev.classList.add('muted'); prev.style.pointerEvents = 'none';
      }
      if (hasMore) {
        next.href = '/admin/books?' + (function(){ const t = new URLSearchParams(qs); t.set('page', curPage + 1); return t.toString(); })();
      } else {
        next.classList.add('muted'); next.style.pointerEvents = 'none';
      }
    })();
  </script>
</body>
</html>
