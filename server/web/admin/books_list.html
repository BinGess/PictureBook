<!doctype html>
<html><head><meta charset="utf-8"><title>书籍列表</title></head>
<body>
<h1>书籍列表</h1>
<a href="/admin/books/new">新建书籍</a>
<table border="1" cellpadding="6" cellspacing="0">
  <tr><th>ID</th><th>标题</th><th>适龄</th><th>编辑推荐</th><th>操作</th></tr>
  {{range .items}}
  <tr>
    <td>{{.ID}}</td>
    <td>{{.Title}}</td>
    <td>{{.AgeMin}}-{{.AgeMax}}</td>
    <td>{{.IsEditorPick}}</td>
    <td><a href="/admin/books/{{.ID}}/pages">页面</a></td>
  </tr>
  {{end}}
</table>
</body></html>
