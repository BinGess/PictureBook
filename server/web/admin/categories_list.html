<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>分类管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="nav">
    <a href="/admin/books">管理后台</a>
    <div class="spacer"></div>
    <a href="/admin/categories/new" class="btn primary small">新建分类</a>
  </div>
  <div class="container">
    <div class="card">
      <h2 class="title">分类列表</h2>
      <table>
        <tr><th>ID</th><th>名称</th><th>描述</th><th>操作</th></tr>
        {{range .categories}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Name}}</td>
          <td class="muted">{{.Description}}</td>
          <td>
            <form method="post" action="/admin/categories/{{.ID}}/delete" onsubmit="return confirm('确认删除该分类？有书籍时将无法删除');">
              <button class="btn danger small" type="submit">删除</button>
            </form>
          </td>
        </tr>
        {{end}}
      </table>
    </div>
  </div>
</body>
</html>
