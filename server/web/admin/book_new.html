<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>新建书籍</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="nav">
    <a href="/admin/books">管理后台</a>
    <div class="spacer"></div>
    <a href="/admin/categories" class="btn small">分类管理</a>
    <a href="/admin/books" class="btn small">返回列表</a>
  </div>
  <div class="container">
    <div class="card">
      <h2 class="title">新建书籍</h2>
      {{if .error}}<div class="muted" style="color:#dc2626;">编辑推荐已达上限</div>{{end}}
      <form method="post" action="/admin/books/new">
        <div class="grid">
          <div>
            <div class="field"><div class="label">ID</div><input class="input" name="id" required></div>
            <div class="field"><div class="label">标题</div><input class="input" name="title" required></div>
            <div class="field"><div class="label">分类</div>
              <select class="input" name="category_id" required>
                {{range .categories}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
              </select>
            </div>
            <div class="field"><div class="label">封面URL</div><input class="input" id="coverURL" name="coverURL"></div>
            <div class="field row">
              <label class="btn small">上传封面<input id="coverFile" type="file" name="file" style="display:none"></label>
              <button id="uploadCoverBtn" type="button" class="btn small">上传并填充URL</button>
              <div id="coverProgress" class="progress"><div id="coverBar" class="bar"></div></div>
              <span id="coverStatus" class="muted" style="margin-left:8px;">0%</span>
            </div>
            <div class="row">
              <div class="field" style="flex:1"><div class="label">适龄最小</div><input class="input" name="ageMin" value="3"></div>
              <div class="field" style="flex:1"><div class="label">适龄最大</div><input class="input" name="ageMax" value="10"></div>
            </div>
            <div class="field"><div class="label">标签(逗号分隔)</div><input class="input" name="tags"></div>
            <div class="field"><div class="label">主题(逗号分隔)</div><input class="input" name="themeKeywords"></div>
            <div class="row">
              <div class="field" style="flex:1"><div class="label">热门度</div><input class="input" name="popularityScore" value="0.5"></div>
              <div class="field" style="flex:1"><label class="label">编辑推荐</label><input type="checkbox" name="isEditorPick"></div>
            </div>
            <div class="actions">
              <button class="btn primary" type="submit">创建</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

<script>
  (function(){
    const btn = document.getElementById('uploadCoverBtn');
    const fileInput = document.getElementById('coverFile');
    const bar = document.getElementById('coverBar');
    const status = document.getElementById('coverStatus');
    const coverURL = document.getElementById('coverURL');
    btn.addEventListener('click', function(){
      const f = fileInput.files && fileInput.files[0];
      if (!f) { alert('请选择封面图片'); return; }
      const fd = new FormData();
      fd.append('file', f, f.name);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/v1/admin/upload');
      xhr.upload.onprogress = function(evt){
        if (evt.lengthComputable) {
          const p = Math.round((evt.loaded / evt.total) * 100);
          bar.style.width = p + '%';
          status.textContent = p + '%';
        }
      };
      xhr.onload = function(){
        if (xhr.status === 200) {
          try {
            const res = JSON.parse(xhr.responseText);
            if (res.file_url) { coverURL.value = res.file_url; status.textContent = '完成'; }
          } catch(e){ status.textContent = '失败'; }
        } else { status.textContent = '失败'; }
      };
      xhr.onerror = function(){ status.textContent = '失败'; };
      xhr.send(fd);
    });
  })();
</script>
</body></html>
