<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>新建分类</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="nav">
    <a href="/admin/books">管理后台</a>
    <div class="spacer"></div>
    <a href="/admin/categories" class="btn small">返回分类列表</a>
  </div>
  <div class="container">
    <div class="card">
      <h2 class="title">新建分类</h2>
      <form method="post" action="/admin/categories/new">
        <div class="field"><div class="label">ID</div><input class="input" name="id" required></div>
        <div class="field"><div class="label">名称</div><input class="input" name="name" required></div>
        <div class="field"><div class="label">描述</div><textarea class="input" name="description" rows="4"></textarea></div>
        <div class="actions"><button class="btn primary" type="submit">创建</button></div>
      </form>
    </div>
  </div>
</body>
</html>
